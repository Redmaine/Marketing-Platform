# Agency view deploy — ops.yourcompanyai.co.uk
# Set the custom domain in Netlify → Domain management.
#
# Env vars (Netlify → Site settings → Environment):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   — frontend (build time)
#   INTERNAL_SECRET, SUPABASE_SERVICE_KEY       — required by the
#     /api/refresh-status function. These were NOT previously set on this
#     site (it had no functions until refresh-status was added), which is
#     why that endpoint's first live call returned
#     "Server not configured". Set both before using it.
#   ANTHROPIC_API_KEY, RESEND_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   INTERNAL_SECRET (shared with refresh-status.js above) — required by
#     netlify/functions/opportunity-scanner-worker-background.mjs (moved
#     here from a Supabase edge function that kept timing out at 150s —
#     see that file's header comment). Confirmed via `netlify env:list`
#     that NONE of these were set on this site as of that migration —
#     the function will return "not configured" until they are.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Bumped from 20 -> 22: Node 20's Supabase client needs a WebSocket polyfill
  # it doesn't have, which crashed opportunity-scanner-worker-background.mjs
  # with "Node.js 20 detected without native WebSocket support". Node 22 has
  # native WebSocket support. This value takes precedence over the site's
  # NODE_VERSION env var (confirmed live: setting the env var alone did not
  # change what `netlify env:get NODE_VERSION` resolved to until this changed).
  NODE_VERSION = "22"
  # SUPABASE_URL is a project URL, not a credential (the actual secrets are
  # the anon/service_role keys) — it appears as plain documentation/config
  # text across netlify.toml, .env.example, and the cron migration SQL
  # files. Netlify's secret scanner started flagging every occurrence as a
  # leaked secret and has been failing every deploy on this site since this
  # morning, unrelated to any code change. Omit it from the scan.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# First Netlify Function in this repo — this block is required for
# netlify/functions/* to be bundled and deployed at all.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# On-demand regeneration of the daily status JSON (Quill calls this).
# MUST come before the /* SPA catch-all below, or the catch-all swallows it
# and returns index.html instead of JSON.
[[redirects]]
  from = "/api/refresh-status"
  to = "/.netlify/functions/refresh-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/daily-status"
  to = "https://fvyvtdwsomxfkpxwygpk.supabase.co/storage/v1/object/public/ops-exports/daily-status.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/daily-status"
  [headers.values]
    Content-Type = "application/json"

# opportunity-scanner-worker-background is a background function (fired by
# the Supabase opportunity-scanner trigger via pg_cron) — its immediate 202
# was getting cached by Netlify's edge layer, which could serve a stale
# cached 202 in place of actually re-invoking the function on a later run.
[[headers]]
  for = "/.netlify/functions/opportunity-scanner-worker-background"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
